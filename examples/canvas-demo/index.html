<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Canvas 2D Demo</title></head>
<body>
    <h2>Canvas 2D Demo</h2>
    <canvas id="c" width="300" height="300" style="border: 1px solid #000;"></canvas>
    <script src="mistfox-sdk.js"></script>
    <script>
        let c = document.getElementById("c");
        let ctx = c.getContext("2d");
        ctx.fillStyle = "red";
        ctx.fillRect(10, 10, 100, 100);
        ctx.fillStyle = "blue";
        ctx.arc(150, 150, 50, 0, Math.PI * 2);
        ctx.fill();
    </script>
</body>
</html>
