<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Device Info</title></head>
<body>
    <h2>Device Info</h2>
    <pre id="out">Loading...</pre>
    <script src="mistfox-sdk.js"></script>
    <script>
        async function load() {
            let info = await Mist.device.info();
            document.getElementById("out").innerText = JSON.stringify(info, null, 2);
        }
        load();
    </script>
</body>
</html>
